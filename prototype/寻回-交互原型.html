:root{--teal:#6251d8;--ink:#252444;--muted:#797890;--line:#e3e1ee;--bg:#f5f5fb}*{box-sizing:border-box}body{margin:0;background:#eaeaf5;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button,a{cursor:pointer}a{color:inherit;text-decoration:none}button{border:0;background:none;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #aaa0f0;outline-offset:3px}.app{max-width:460px;margin:auto;background:var(--bg);min-height:100dvh;padding-bottom:100px}.header{height:64px;padding:0 20px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:3}.header strong{font-size:18px;color:#5544bb}.header{border-bottom:3px solid #e9e4ff}.card{box-shadow:0 3px 12px #40367a05}.title{letter-spacing:.15px}.back{font-size:30px;line-height:1;padding:0 4px}.headlink{margin-left:auto;font-size:14px;color:var(--muted)}main{padding:18px 16px}.search{display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--line);border-radius:15px;padding:10px 14px;width:100%;color:var(--muted)}.search input{padding:0;border:0;outline:0;background:transparent;width:100%;min-width:0}.search button{color:var(--teal);white-space:nowrap}.tabs{display:flex;gap:10px;margin:16px 0 12px}.chip{border:1px solid var(--line);border-radius:24px;background:white;padding:5px 17px;font-size:14px;color:var(--muted)}.chip.active{background:var(--teal);border-color:var(--teal);color:white}.hint{font-size:13px;color:var(--muted);padding:7px 12px;background:#eeecfa;border-radius:10px;margin-bottom:10px}.card{background:white;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;padding:14px;display:flex;gap:13px;align-items:center;width:100%;text-align:left}.card:hover{border-color:#b7acee}.ico{width:64px;height:64px;background:#eeebff;color:#6251d8;border-radius:15px;display:grid;place-items:center;flex-shrink:0}.ico svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ico.key{background:#fff1e1;color:#b66b0d}.ico.umbrella{background:#e9f3e2;color:#629537}.ico.cup{background:#e5edff;color:#426ce3}.ico.audio{background:#eee7f8;color:#8754bb}.ico.book{background:#fff0f3;color:#cf5372}.ico.glasses{background:#e6f0e9;color:#398663}.ico.battery{background:#fff6dc;color:#b89009}.title{font-weight:650}.badge{font-weight:500;font-size:12px;white-space:nowrap;display:inline-block;padding:0 7px;border-radius:5px;background:#eeeaff;color:#6251d8;margin-left:6px}.badge.lost{background:#fff3e1;color:#d68213}.badge.done{background:#e9eeef;color:#758491}.meta{font-size:13px;color:var(--muted);margin-top:3px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;height:76px;background:#ffffffed;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5;backdrop-filter:blur(12px)}.nav a{text-align:center;display:grid;gap:1px;font-size:12px;color:var(--muted);min-width:65px}.nav .current{color:var(--teal)}.nav .symbol{font-size:24px;height:30px;line-height:30px}.nav .plus{background:var(--teal);color:white;border-radius:50%;width:45px;height:45px;line-height:42px;margin:-17px auto 0;box-shadow:0 4px 13px #6251d840;font-size:30px}.primary,.secondary{display:block;width:100%;padding:12px 18px;border-radius:13px;text-align:center;font-weight:650;background:var(--teal);color:white;border:1px solid var(--teal);margin-top:15px}.secondary{background:white;color:#6251d8}.types{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.type{border:2px solid var(--line);border-radius:16px;padding:14px 5px;background:white;text-align:center}.type.selected{border-color:var(--teal);background:#eeebff}.type span{display:block;color:var(--teal);font-size:26px}.type small{display:block;font-size:12px;color:var(--muted)}label{display:block;font-size:14px;color:var(--muted);margin:13px 0 5px}em{color:#ed6969;font-style:normal}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:11px 12px;color:var(--ink)}textarea{resize:vertical;min-height:105px}input:focus,textarea:focus,select:focus{outline:2px solid #b6acf3}.categories{display:flex;flex-wrap:wrap;gap:8px}.categories label{margin:0}.categories input{position:absolute;opacity:0;width:1px}.categories span{display:block;border:1px solid var(--line);border-radius:24px;background:white;padding:5px 12px;font-size:14px}.categories input:checked+span{color:#5948c3;border-color:var(--teal);background:#eeebff}.panel{border:1px solid var(--line);border-radius:18px;background:white;margin-bottom:12px;overflow:hidden}.hero{text-align:center;padding:24px 16px}.hero .ico{width:96px;height:96px;margin:0 auto 12px;border-radius:25px}.hero .ico svg{width:45px;height:45px}h1{font-size:23px;margin:7px 0}h2{font-size:17px;margin:0 0 12px}.row{display:flex;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}.row>span:first-child{width:75px;color:var(--muted);flex-shrink:0}.paragraph{padding:17px;font-size:14px;line-height:1.9}.paragraph h2{font-size:14px;color:var(--muted)}.contact{background:#eeebff;border:1px solid #dcd5fb;border-radius:17px;padding:16px;color:#5948c3;font-size:14px}.contact strong{display:block;font-size:22px}.success{text-align:center;padding:60px 18px}.check{width:96px;height:96px;margin:8px auto 20px;border-radius:50%;display:grid;place-items:center;font-size:52px;background:var(--teal);color:white;box-shadow:0 12px 24px #6251d830}.success p{font-size:14px;color:var(--muted)}.mine{display:block}.mine .card{border:0;padding:0;margin:0}.actions{display:flex;gap:9px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.smallbtn{padding:4px 11px;border-radius:10px;border:1px solid var(--teal);color:var(--teal);font-size:13px}.danger{border-color:#ffc3c3;color:#e36161}.empty{text-align:center;padding:55px 10px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:20px;padding:25px;max-width:350px;width:90%;color:var(--ink)}dialog::backdrop{background:#25244450}.flow{display:flex;flex-direction:column;align-items:center;gap:6px;margin:15px 0}.flow span{border:1px solid #dcd5fb;border-radius:9px;padding:8px 15px;background:#f2efff;min-width:170px;text-align:center}.flow b{font-weight:400;color:var(--teal)}ul{padding-left:21px}#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#36305b;color:white;padding:10px 18px;border-radius:12px;z-index:20;max-width:90%;font-size:14px} .overview .app{min-height:900px;width:390px;margin:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;padding-bottom:20px}.overview{display:flex;gap:24px;align-items:flex-start;padding:24px;width:max-content}.overview .header{position:static}.overview .nav{display:none}@media(min-width:600px){body:not(.overview){padding:24px 0}.app{min-height:calc(100dvh - 48px);border-radius:22px;overflow:hidden;box-shadow:0 14px 65px #362d6912}.nav{bottom:24px;border-radius:0 0 22px 22px}}@media print{.nav,.headlink{display:none}}
</style></head><body><div class="app"><header class="header" id="header"></header><main id="main"></main><nav class="nav" id="nav"></nav></div><dialog id="dialog"></dialog><div id="toast" hidden></div><script>
const paths={card:'M4 6h24v19H4z M4 12h24 M9 18h5',umbrella:'M4 16a12 12 0 0 1 24 0H4 M16 16v11q0 5 5 1',key:'M13 16a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M13 16h15l-3 3m-2-3v-3',cup:'M7 11h16v15H7z M23 13h3q6 6-3 7 M11 3v4m6-4v4',audio:'M8 21V12a8 8 0 0 1 16 0v13q0 5-8 4v-8 M8 15h5v10H8z M20 14h4v8h-4z',book:'M6 5h21v23H6q-4-4 0-7h21 M6 5q-3 0-3 4v16',glasses:'M13 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18 M20 20l9 9',battery:'M7 7h18v22H7z M13 3h6v4 M12 14h8'};
const icon=x=>`<div class="ico ${x}"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="${paths[x]||paths.card}"/></svg></div>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=[{id:1,name:'学生证（尾号 3168）',type:'招领',cat:'证件',icon:'card',place:'学生服务中心一楼',time:'昨天 17:25',desc:'在自助打印机旁发现一本深蓝色学生证，尾号 3168。请失主说明姓名和学院，核对后领取。',mine:true},{id:2,name:'浅蓝色折叠伞',type:'招领',cat:'雨伞',icon:'umbrella',place:'梧桐餐厅西侧',time:'今天 11:40',desc:'浅蓝色三折伞，伞柄挂着一只白色小兔挂件，放在餐厅西侧长椅上。请失主说明伞套特征。'},{id:3,name:'宿舍门禁钥匙',type:'寻物',cat:'钥匙',icon:'key',place:'北区宿舍楼下',time:'今天 07:50',desc:'今天早上出门后发现钥匙不见了，有两把银色钥匙和一枚橙色门禁扣。可能遗落在北区宿舍楼下，请捡到的同学联系我。'},{id:4,name:'奶黄色随行杯',type:'招领',cat:'水杯',icon:'cup',place:'明理楼 B203',time:'今天 10:15',desc:'奶黄色带提手随行杯，杯身有一张小熊贴纸，在明理楼 B203 后排课桌上发现。'},{id:5,name:'银灰色头戴耳机',type:'寻物',cat:'耳机',icon:'audio',place:'创客空间讨论室',time:'昨天 19:20',desc:'银灰色头戴式无线耳机，耳罩外侧有一道小划痕，可能遗落在创客空间讨论室的沙发上。'},{id:6,name:'《高等数学》笔记本',type:'招领',cat:'书籍',icon:'book',place:'南门快递驿站',time:'前天 14:35',desc:'一本深绿色封面的高等数学笔记本，已与失主核实并归还。',done:true},{id:7,name:'透明框眼镜',type:'寻物',cat:'其他',icon:'glasses',place:'风雨操场',time:'今天 15:10',desc:'透明方框近视眼镜，配有灰色软布眼镜袋。跑步后发现遗失，可能在风雨操场休息区。'},{id:8,name:'紫色充电宝 10000mAh',type:'招领',cat:'其他',icon:'battery',place:'校园书店门口',time:'昨天 08:45',desc:'紫色 10000mAh 充电宝，自带白色充电线，在校园书店门口的台阶上捡到。'},{id:9,name:'奶黄色随行杯',type:'寻物',cat:'水杯',icon:'cup',place:'明理楼 B203',time:'上周四 16:20',desc:'已在教室讲台找到随行杯，谢谢帮忙留意的同学！',done:true,mine:true}];
let items;try{items=JSON.parse(localStorage.getItem('xunhui-demo-v2'))||initial; if(!localStorage.getItem('xunhui-demo-v2')){const old=JSON.parse(localStorage.getItem('shiguang-demo-v1')||'[]');items=[...old.filter(i=>i.id>9),...initial]}}catch{items=initial}let filter='全部',query='',lastId=1;const save=()=>{try{localStorage.setItem('xunhui-demo-v2',JSON.stringify(items))}catch{}};const badge=i=>`<span class="badge ${i.done?'done':i.type==='寻物'?'lost':''}">${i.done?(i.type==='招领'?'已归还':'已找到'):i.type}</span>`;const card=i=>`<a class="card" href="#detail/${i.id}">${icon(i.icon)}<div><div class="title">${esc(i.name)} ${badge(i)}</div><div class="meta">⌖ ${esc(i.place)} · ${esc(i.time)}</div></div></a>`;
function tabs(){return `<div class="tabs">${['全部','寻物','招领'].map(t=>`<button class="chip ${filter===t?'active':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}</div>`}function list(search=false){const found=items.filter(i=>(search||i.id!==9)&&(filter==='全部'||i.type===filter)&&(!search||[i.name,i.place,i.cat].some(v=>v.includes(query))));return `${tabs()}<div class="hint">${search?`共 ${found.length} 条${query?'匹配':''}信息`:`当前共有 ${items.filter(i=>!i.done).length} 条进行中的信息（演示数据）`}</div>${found.map(card).join('')||'<div class="empty">没有找到相关物品<br><small>试试物品名称、类别或地点</small><button class="secondary" onclick="query=\'\';filter=\'全部\';render()">清空搜索条件</button></div>'}`}
function form(){return `<form id="publishForm"><div class="types"><label class="type selected" id="lostType"><span>♡</span><input type="radio" name="type" value="寻物" checked hidden onchange="setType(false)">我丢了东西<small>发布寻物信息</small></label><label class="type" id="foundType"><span>⊙</span><input type="radio" name="type" value="招领" hidden onchange="setType(true)">我捡到东西<small>发布招领信息</small></label></div><label for="name">物品名称 <em>*</em></label><input id="name" name="name" required maxlength="40" placeholder="如：学生证 / 浅蓝色折叠伞"><label>物品类别</label><div class="categories">${['证件','钥匙','水杯','雨伞','耳机','书籍','其他'].map((c,n)=>`<label><input type="radio" name="cat" value="${c}" ${!n?'checked':''}><span>${c}</span></label>`).join('')}</div><label for="place">地点 <em>*</em></label><input id="place" name="place" required maxlength="60" placeholder="如：梧桐餐厅西侧 / 明理楼"><label for="time">时间</label><input id="time" name="time" maxlength="40" placeholder="如：今天 14:20"><label for="desc">详细描述</label><textarea id="desc" name="desc" maxlength="500" placeholder="补充物品颜色、外观、丢失或拾取经过…"></textarea><label for="contact">联系方式 <em>*</em></label><input id="contact" name="contact" required maxlength="80" placeholder="手机号或微信号（请使用演示内容）"><p class="meta">这是交互原型，发布内容仅保存在当前浏览器。</p><button class="primary" type="submit">发布</button></form>`}
function detail(i){return `<section class="panel hero">${icon(i.icon)}<h1>${esc(i.name)}</h1>${badge(i)}<div class="meta">⌖ ${esc(i.place)} · ${esc(i.time)}</div></section><section class="panel">${[['类型',i.type],['地点',i.place],['时间',i.time],['发布者',i.mine?'我':'林同学']].map(([a,b])=>`<div class="row"><span>${a}</span><span>${esc(b)}</span></div>`).join('')}</section><section class="panel paragraph"><h2>物品描述</h2>${esc(i.desc||'暂无补充描述')}</section><div class="contact">联系方式（原型演示）<strong>${i.contact?'已填写联系方式':'示例微信：xunhui_demo'}</strong><small>联系时请核对物品特征，确认后再交接。</small></div><button class="primary" onclick="contact(${i.id})">联系发布者</button>`}
function mine(){return `<div class="hint">发布的信息可以在这里修改状态或删除。</div>${items.filter(i=>i.mine).map(i=>`<section class="panel paragraph mine">${card(i)}<div class="actions">${!i.done?`<button class="smallbtn" onclick="done(${i.id})">标记为${i.type==='招领'?'已归还':'已找到'}</button>`:''}<button class="smallbtn danger" onclick="removeItem(${i.id})">删除</button></div></section>`).join('')||'<div class="empty">你还没有发布信息<a class="primary" href="#publish">发布一条信息</a></div>'}`}
function about(){return `<section class="panel paragraph"><h2>主要用户与需求</h2><p><b>丢失物品的学生、教职工：</b>快速查找物品线索，发布寻物信息并联系拾得者。</p><p><b>拾到物品的师生：</b>方便地发布招领信息，核验失主并归还物品。</p><p><b>解决的问题：</b>校园群聊信息分散、容易被刷走、检索不便，以及物品找回后状态不及时更新。</p></section><section class="panel paragraph"><h2>主要功能</h2><ul><li>浏览失物和招领信息，按类型筛选</li><li>发布寻物信息、发布招领信息</li><li>按物品名称、类别或地点搜索</li><li>查看详情与联系方式</li><li>查看我的发布，修改状态或删除信息</li></ul></section><section class="panel paragraph"><h2>浏览与搜索流程</h2><div class="flow"><span>进入首页</span><b>↓</b><span>浏览或搜索信息</span><b>↓</b><span>查看物品详情</span><b>↓</b><span>联系发布者</span></div><h2>发布流程</h2><div class="flow"><span>进入发布页面</span><b>↓</b><span>选择寻物或招领</span><b>↓</b><span>填写物品信息</span><b>↓</b><span>点击发布 · 校验必填项</span><b>↓</b><span>发布成功</span><b>↓</b><span>我的发布 · 更新状态</span></div></section><section class="panel paragraph"><h2>原型说明与导出</h2><p>示例联系方式不拨号、不发送消息。新发布和状态修改保存在当前浏览器；不会通知其他用户。</p><p>下载 HTML 后，可使用墨刀支持的 HTML 转原型能力进行转换。转换后的交互效果需在墨刀中检查和补充。</p><button class="secondary" onclick="exportHTML()">下载六页面 HTML（墨刀转换用）</button><a class="secondary" href="index.html" download="寻回-交互原型.html">下载可交互 HTML</a></section>`}
function render(){let [page,id]=(location.hash.slice(1)||'home').split('/');let names={home:'寻回 · 失物招领',search:'搜索物品',publish:'发布信息',success:'发布结果',mine:'我的发布',detail:'信息详情',about:'原型说明'};if(!names[page])page='home';document.getElementById('header').innerHTML=`${page!=='home'&&page!=='success'?'<a class="back" href="#home" aria-label="返回首页">‹</a>':''}<strong>${names[page]}</strong>${page==='home'?'<a class="headlink" href="#about">说明与导出</a>':''}`;let html='';if(page==='home')html='<a class="search" href="#search">⌕　搜索物品名称、地点…</a>'+list();if(page==='search')html=`<form class="search" id="searchForm"><input aria-label="搜索物品名称或地点" id="q" value="${esc(query)}" placeholder="输入物品名称，如：学生证"><button>搜索</button></form>`+list(true);if(page==='publish')html=form();if(page==='detail'){let i=items.find(x=>x.id==id);html=i?detail(i):'<div class="empty">该信息已删除<a href="#home" class="secondary">返回首页</a></div>'}if(page==='mine')html=mine();if(page==='success')html=`<div class="success"><div class="check">✓</div><h1>发布成功</h1><p>你的${esc(items.find(i=>i.id===lastId)?.type||'寻物')}信息已发布，<br>可在首页查看，并在“我的发布”管理。</p><a class="primary" href="#home">返回首页</a><a class="secondary" href="#mine">查看我的发布</a><a class="secondary" href="#detail/${lastId}">查看刚发布的信息</a></div>`;if(page==='about')html=about();document.getElementById('main').innerHTML=html;document.getElementById('nav').innerHTML=`<a href="#home" class="${page==='home'?'current':''}"><span class="symbol">⌂</span>首页</a><a href="#publish" class="${page==='publish'?'current':''}"><span class="plus">+</span>发布</a><a href="#mine" class="${page==='mine'?'current':''}"><span class="symbol">♙</span>我的发布</a>`;document.getElementById('searchForm')?.addEventListener('submit',e=>{e.preventDefault();query=document.getElementById('q').value.trim();render()});document.getElementById('publishForm')?.addEventListener('submit',submit)}
function setType(found){document.getElementById('lostType').classList.toggle('selected',!found);document.getElementById('foundType').classList.toggle('selected',found)}function submit(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(!d.name.trim()||!d.place.trim()||!d.contact.trim()){toast('请填写物品名称、地点和联系方式');return}lastId=Date.now();items.unshift({...d,name:d.name.trim(),place:d.place.trim(),id:lastId,mine:true,time:d.time.trim()||'刚刚',icon:({证件:'card',钥匙:'key',水杯:'cup',雨伞:'umbrella',耳机:'audio',书籍:'book'})[d.cat]||'battery'});save();filter='全部';location.hash='success'}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.hidden=false;setTimeout(()=>x.hidden=true,2500)}function modal(html){let d=document.getElementById('dialog');d.innerHTML=html;d.showModal()}function contact(id){let i=items.find(x=>x.id===id);modal(`<h2>联系发布者</h2><p>${esc(i.contact||'演示微信号：xunhui_demo')}</p><p class="meta">这是原型演示，不会拨打电话或发送消息。请先描述物品特征，核实后再交接。</p><button class="primary" onclick="document.getElementById('dialog').close()">我知道了</button>`)}function done(id){items.find(i=>i.id===id).done=true;save();render();toast('状态已更新')}function removeItem(id){modal(`<h2>删除这条信息？</h2><p class="meta">删除后将不再显示在首页和我的发布中。</p><button class="primary" onclick="items=items.filter(i=>i.id!==${id});save();document.getElementById('dialog').close();render();toast('已删除')">确认删除</button><button class="secondary" onclick="document.getElementById('dialog').close()">取消</button>`)}
function exportHTML(){const sections=[['首页','<div class="search">⌕　搜索物品名称、地点…</div>'+list()],['搜索页面','<div class="search">学生证</div>'+tabs()+card(items.find(i=>i.id===1)||initial[0])],['信息详情',detail(items.find(i=>i.id===3)||initial[2])],['发布信息',form()],['发布成功','<div class="success"><div class="check">✓</div><h1>发布成功</h1><p>你的寻物信息已发布。</p><a class="primary">返回首页</a><a class="secondary">查看我的发布</a></div>'],['我的发布',mine()]];let html='<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>寻回 · 六页面原型</title><style>'+document.querySelector('style').textContent+'</style><body class="overview">'+sections.map(([name,body])=>'<section class="app"><header class="header"><strong>'+name+'</strong></header><main>'+body+'</main></section>').join('')+'</body></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download='寻回-六页面-墨刀转换.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
